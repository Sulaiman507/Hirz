name: Build Hirz APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
# يلزم لرفع الـ APK كمرفق في الـ Release / needed to attach the APK to a release
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Scaffold project
        run: |
          flutter create -t app --org dev.hirz --project-name hirz scaffold
          rm -rf scaffold/lib scaffold/test
          cp -r lib scaffold/lib
          cp -r assets scaffold/assets
          cp pubspec.yaml analysis_options.yaml scaffold/
          mkdir -p scaffold/test && cp -r test/. scaffold/test/
          python3 scripts/android_patches.py
      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get
      - name: Bump plugin compileSdk in pub cache
        working-directory: scaffold
        run: python3 ../scripts/bump_plugin_compilesdk.py
      - name: Analyze
        working-directory: scaffold
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: scaffold
        run: flutter test
      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release
      - name: Create release with APK
        # بعد كل بناء ناجح على main: ينشئ Release تلقائياً ويرفق الـ APK
        # (بدون مشغّل release لتفادي حلقة لا نهائية: push ← build ← release)
        # After every successful main build: auto-create a Release with the APK
        # (no release trigger — avoids an infinite push→build→release loop)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Hirz build ${{ github.run_number }}" \
            --notes "بناء تلقائي من main — commit ${{ github.sha }}" \
            --prerelease \
            scaffold/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hirz-release-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
