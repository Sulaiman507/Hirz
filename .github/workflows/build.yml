name: Build Hirz APK
on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
# يلزم لرفع الـ APK كمرفق في الـ Release / needed to attach the APK to a release
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Scaffold project
        run: |
          flutter create -t app --org dev.hirz --project-name hirz scaffold
          rm -rf scaffold/lib scaffold/test
          cp -r lib scaffold/lib
          cp -r assets scaffold/assets
          cp pubspec.yaml analysis_options.yaml scaffold/
          mkdir -p scaffold/test && cp -r test/. scaffold/test/
          python3 scripts/android_patches.py
      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get
      - name: Bump plugin compileSdk in pub cache
        working-directory: scaffold
        run: python3 ../scripts/bump_plugin_compilesdk.py
      - name: Analyze
        working-directory: scaffold
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: scaffold
        run: flutter test
      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release
      - name: Attach APK to release
        # يعمل فقط عند نشر Release — يرفق الـ APK برابط تحميل مباشر دائم
        # Runs only on release events — attaches the APK with a permanent direct link
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            scaffold/build/app/outputs/flutter-apk/app-release.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: hirz-release-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
