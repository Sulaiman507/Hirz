name: hirz
description: حِرز — تطبيق مواقيت صلاة يعمل بدون إنترنت
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  flutter_riverpod: ^3.4.2
  adhan: ^2.0.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  intl: any

dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - lib/l10n/
    - assets/audio/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
